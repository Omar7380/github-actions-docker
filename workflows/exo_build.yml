# Ce workflow montre un exemple de build basique

nom: Exemple de Build

# Définit quand le workflow doit s'exécuter
déclencheur:
  # Se déclenche sur les pull requests qui modifient des fichiers YAML
  pull_request:
    chemins:
      - "**/*.yml"        # Tous les fichiers YAML
      - "!test/**/*.yml"  # Sauf ceux dans le dossier test/

  # Permet de lancer le workflow manuellement
  déclenchement_manuel:

# Un workflow est composé d'un ou plusieurs jobs
jobs:
  # Job de construction principal
  construction:
    # Type de machine qui exécutera le job
    exécute_sur: ubuntu-dernière-version

    # Étapes à exécuter
    étapes:
      # Étape 1: Vérification du code
      - nom: Vérification des fichiers
        exécuter: |
          echo "Vérification des fichiers YAML..."
          find . -name "*.yml" -o -name "*.yaml" | xargs -n 1 yamllint || true

      # Étape 2: Affichage des informations système
      - nom: Afficher les informations système
        exécuter: |
          echo "Système d'exploitation: ${{ runner.os }}"
          echo "Répertoire de travail: ${{ github.workspace }}"
          echo "Branche: ${{ github.ref_name }}"
