apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-demo
  labels:
    app: github-actions-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: github-actions-demo
  template:
    metadata:
      labels:
        app: github-actions-demo
    spec:
      containers:
      - name: github-actions-demo
        image: $DOCKER_IMAGE:$IMAGE_TAG
        ports:
        - containerPort: 5000
        env:
        - name: ENVIRONMENT
          value: production
